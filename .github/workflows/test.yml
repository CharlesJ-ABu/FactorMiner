name: Product tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests
      - name: Check installed wheel outside the source tree
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/fm-wheel" .
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/fm-wheel/factorminer-*.whl
          cd "$RUNNER_TEMP"
          python -c 'from core.commands import download, inspect, mine; from api.main import app'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
